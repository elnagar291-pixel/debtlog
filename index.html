<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المديونية</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0f766e">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#667;--pr:#0f766e;--red:#b91c1c;--bd:#dde}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2127;--tx:#eee;--mut:#9ab;--bd:#334}}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--pr);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
main{padding:12px;max-width:600px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-top:8px}
button{background:var(--pr);color:#fff;border:0;font-weight:bold}button.alt{background:#b45309}button.gr{background:#667}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.cust{cursor:pointer}.red{color:var(--red);font-weight:bold}.mut{color:var(--mut);font-size:13px}
.soon{border:2px solid #d97706;background:rgba(217,119,6,.12)}.late{border:2px solid #b91c1c;background:rgba(185,28,28,.10)}.tag{font-size:12px;padding:2px 8px;border-radius:8px;color:#fff}.tag.o{background:#d97706}.tag.r{background:#b91c1c}
.big{text-align:center}.num{font-size:26px;font-weight:bold}.gn{color:#15803d}.tile{display:flex;justify-content:space-between;align-items:center;font-size:18px;cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}#msg{position:fixed;bottom:16px;left:16px;right:16px;background:#111;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center}
</style></head><body>
<header><b onclick="home()" style="cursor:pointer">متابعة المديونية</b><span id="today" class="mut" style="color:#fff"></span></header>
<main id="app"><div class="card">
<p>اتأكد إنك مدخل الـ Client ID في أول الكود (CONFIG).</p><button onclick="login()">تسجيل الدخول بحساب Microsoft</button></div></main>
<div id="msg"></div>
<script>
// ===== CONFIG: عدّل هنا بس =====
const CONFIG={clientId:"b79514a7-23a6-4a62-b7d8-1d6ef6c52582",filePath:"/DebtLog.xlsx"}; // مسار الملف داخل OneDrive
// ================================
if(typeof msal==="undefined"){document.addEventListener("DOMContentLoaded",()=>{$("app").innerHTML='<div class="card red">مكتبة الدخول ما اتحملتش، تأكد من النت وجرب تاني</div>'})}
const msalApp=typeof msal==="undefined"?null:new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:"https://login.microsoftonline.com/3e049ef2-19d4-4c16-ae1b-82d2a3a0af6a",redirectUri:"https://elnagar291-pixel.github.io/debtlog/"},cache:{cacheLocation:"localStorage"}});
const SCOPES=["Files.ReadWrite","User.Read"];let customers=[],log=[],cur=null;
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString("en-US");
const serial=d=>Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)+25569;
const fromSerial=s=>typeof s==="number"?new Date((s-25569)*864e5):null;
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const serialY=t=>{const[a,b,c]=t.split("-").map(Number);return Math.floor(Date.UTC(a,b-1,c)/864e5)+25569};
let selDate=ymd(new Date());
const dstr=d=>d?String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear():"";
function toast(t){const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2500)}
async function login(){try{await msalApp.loginRedirect({scopes:SCOPES})}catch(e){toast("خطأ: "+(e.message||e))}}
async function token(){const a=msalApp.getAllAccounts()[0];if(!a)throw"login";
 try{return(await msalApp.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES})}}
async function g(path,opt={}){const t=await token();
 const r=await fetch("https://graph.microsoft.com/v1.0/me/drive/root:"+encodeURI(CONFIG.filePath)+":/workbook"+path,{...opt,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));const tx=await r.text();return tx?JSON.parse(tx):null}
async function load(){const[c,l]=await Promise.all([g("/tables/tblCustomers/rows"),g("/tables/tblLog/rows")]);
 customers=c.value.map(r=>({i:r.index,n:String(r.values[0][0]).trim(),a:r.values[0][1],d:fromSerial(r.values[0][2]),ds:+r.values[0][2]||0,debt:+r.values[0][3]||0})).filter(x=>x.n);
 log=l.value.map(r=>({i:r.index,n:r.values[0][4]||"",d:r.values[0][0],c:String(r.values[0][1]).trim(),t:r.values[0][2],a:+r.values[0][3]||0}))}
function stat(c){const m=log.filter(x=>x.c===c.n);const p=m.filter(x=>x.t==="Payment").reduce((s,x)=>s+x.a,0),dn=m.filter(x=>x.t==="DN").reduce((s,x)=>s+x.a,0);return{p,dn,rest:c.debt-p-dn}}
let view="home",sortBy="due";
const sumPay=ds=>log.filter(x=>x.d===ds&&x.t==="Payment").reduce((a,x)=>a+x.a,0);
const LV={home:0,customers:1,coll:1,add:2,cust:2};let curV="home";
function hp(v){history.pushState({v},"");curV=v}
async function show(v,reload){if(v==="add"||v==="cust")v="customers";curV=v;
 if(reload){$("app").innerHTML='<div class="card">جاري التحديث...</div>';try{await load()}catch(e){}}
 v==="customers"?custPage():v==="coll"?collPage():render()}
async function nav(v){hp(v);await show(v,true)}
function home(){const d=LV[curV]||0;d?history.go(-d):render()}
window.addEventListener("popstate",e=>show((e.state&&e.state.v)||"home",true));
try{history.replaceState({v:"home"},"")}catch(e){}
function render(){view="home";const total=customers.reduce((a,c)=>a+stat(c).rest,0),tp=sumPay(serial(new Date()));
 $("app").innerHTML=`<div class="g"><div class="card big"><div class="mut">إجمالي المديونية</div><div class="num red">${fmt(total)}</div></div><div class="card big"><div class="mut">تحصيل اليوم</div><div class="num gn">${fmt(tp)}</div></div></div>
 <div class="card tile" onclick="nav('customers')"><b>👥 العملاء</b><span class="mut">${customers.length} عميل</span></div>
 <div class="card tile" onclick="nav('coll')"><b>💰 التحصيلات اليومية</b><span class="mut">عرض وتعديل</span></div>`}
function custPage(){view="customers";$("app").innerHTML=`<button class="gr" onclick="history.back()">← الرئيسية</button><input id="q" placeholder="ابحث باسم العميل" oninput="list()"><div class="g"><select id="so" onchange="sortBy=this.value;list()"><option value="due">ترتيب: تاريخ الاستحقاق</option><option value="name">ترتيب: أبجدي</option><option value="rest">ترتيب: الأكبر مديونية</option></select><button onclick="hp('add');addForm()">+ عميل جديد</button></div><div id="list" style="margin-top:10px"></div>`;$("so").value=sortBy;list()}
function list(){const q=($("q")?.value||"").trim(),t=serial(new Date());
 let a=customers.filter(c=>c.n.includes(q));
 if(sortBy==="name")a.sort((x,y)=>x.n.localeCompare(y.n,"ar"));
 else if(sortBy==="rest")a.sort((x,y)=>stat(y).rest-stat(x).rest);
 else a.sort((x,y)=>(x.ds||1e9)-(y.ds||1e9));
 $("list").innerHTML=a.map(c=>{const s=stat(c),dl=c.ds-t;let cls="",tag="";
  if(s.rest>0&&c.ds){if(dl<0){cls=" late";tag=`<span class="tag r">متأخر ${-dl} يوم</span>`}else if(dl<=7){cls=" soon";tag=`<span class="tag o">باقي ${dl} يوم</span>`}}
  return `<div class="card cust${cls}" onclick="hp('cust');open_(${customers.indexOf(c)})"><div class="row" style="border:0"><b>${c.n}</b><span class="${s.rest>0?"red":""}">${fmt(s.rest)}</span></div><div class="mut">${c.a||""} · استحقاق ${dstr(c.d)} ${tag}</div></div>`}).join("")}
function addForm(){$("app").innerHTML=`<div class="card"><h3 style="margin:0">عميل جديد</h3><input id="cn" placeholder="اسم العميل"><input id="ca" placeholder="المنطقة"><span class="mut">تاريخ الاستحقاق</span><input id="cd" type="date" value="${ymd(new Date())}"><input id="cm" type="number" inputmode="decimal" placeholder="المديونية"><button onclick="addCust()">حفظ العميل</button></div><button class="gr" onclick="history.back()">رجوع</button>`}
async function addCust(){const n=$("cn").value.trim(),a=$("ca").value.trim(),d=$("cd").value,m=parseFloat($("cm").value);
 if(!n||!d||isNaN(m))return toast("اكتب الاسم والتاريخ والمديونية");
 if(customers.some(c=>c.n===n))return toast("العميل ده موجود قبل كده");
 const ds=serialY(d);try{await g("/tables/tblCustomers/rows/add",{method:"POST",body:JSON.stringify({values:[[n,a,ds,m]]})});
 customers.push({n,a,d:fromSerial(ds),ds,debt:m});toast("اتضاف ✔");history.back()}catch(e){toast("حصل خطأ: "+e.message)}}
function open_(i){cur=customers[i];const s=stat(cur);
 $("app").innerHTML=`<div class="card"><h3 style="margin:0">${cur.n}</h3><div class="mut">${cur.a||""} · استحقاق ${dstr(cur.d)}</div>
 <div class="row"><span>المديونية</span><b>${fmt(cur.debt)}</b></div><div class="row"><span>مدفوع</span><b>${fmt(s.p)}</b></div><div class="row"><span>إشعار خصم DN</span><b>${fmt(s.dn)}</b></div><div class="row"><span>المتبقي</span><b class="red">${fmt(s.rest)}</b></div></div>
 <div class="card"><span class="mut">تاريخ الحركة</span><input id="dt" type="date" value="${selDate}"><input id="amt" type="number" inputmode="decimal" placeholder="المبلغ"><input id="note" placeholder="ملاحظة (اختياري)">
 <div class="g"><button onclick="add('Payment')">تسجيل دفعة</button><button class="alt" onclick="add('DN')">تسجيل DN</button></div></div><button class="gr" onclick="history.back()">رجوع</button><button style="background:#b91c1c" onclick="delCust()">حذف العميل</button>`}
async function add(type){const a=parseFloat($("amt").value);if(!a||a<=0)return toast("اكتب مبلغ صحيح");
 const dv=$("dt").value||ymd(new Date());const row=[serialY(dv),cur.n,type,a,$("note").value||""];
 try{await g("/tables/tblLog/rows/add",{method:"POST",body:JSON.stringify({values:[row]})});log.push({d:row[0],c:cur.n,t:type,a,n:row[4]});selDate=dv;toast("اتسجل ✔");open_(customers.indexOf(cur))}catch(e){toast("حصل خطأ: "+e.message)}}
async function delCust(){if(!confirm("حذف العميل "+cur.n+"؟ (سجل دفعاته هيفضل في الملف)"))return;
 try{await load();const c=customers.find(x=>x.n===cur.n);if(!c)return history.back();
 await g("/tables/tblCustomers/rows/itemAt(index="+c.i+")",{method:"DELETE"});await load();toast("اتحذف ✔");history.back()}catch(e){toast("حصل خطأ: "+e.message)}}
function collPage(){view="coll";const ds=serialY(selDate),day=log.filter(x=>x.d===ds&&x.t==="Payment"),tp=day.reduce((a,x)=>a+x.a,0);
 $("app").innerHTML=`<button class="gr" onclick="history.back()">← الرئيسية</button><div class="card"><span class="mut">اختر اليوم</span><input id="sd" type="date" value="${selDate}" onchange="selDate=this.value||ymd(new Date());collPage()">
 <div class="row"><span>تحصيل ${dstr(fromSerial(ds))}</span><b class="gn">${fmt(tp)}</b></div><div class="row"><span>عدد العملاء</span><b>${new Set(day.map(x=>x.c)).size}</b></div></div>`+
 (day.length?day.map(x=>`<div class="card"><b>${x.c}</b><div class="g"><input type="number" inputmode="decimal" id="a${x.i}" value="${x.a}"><button onclick="saveP(${x.i})">حفظ</button></div><button class="gr" onclick="delP(${x.i})">حذف الدفعة</button></div>`).join(""):'<div class="card mut">مفيش تحصيلات في اليوم ده</div>')}
async function saveP(i){const x=log.find(e=>e.i===i),a=parseFloat($("a"+i).value);if(!x||!a||a<=0)return toast("اكتب مبلغ صحيح");
 try{await g("/tables/tblLog/rows/itemAt(index="+i+")",{method:"PATCH",body:JSON.stringify({values:[[x.d,x.c,"Payment",a,x.n||""]]})});await load();toast("اتعدل ✔");collPage()}catch(e){toast("حصل خطأ: "+e.message)}}
async function delP(i){if(!confirm("حذف الدفعة دي؟"))return;
 try{await g("/tables/tblLog/rows/itemAt(index="+i+")",{method:"DELETE"});await load();toast("اتحذفت ✔");collPage()}catch(e){toast("حصل خطأ: "+e.message)}}
(async()=>{$("today").textContent=new Date().toLocaleDateString("en-GB");
 try{await msalApp.handleRedirectPromise()}catch(e){}
 if(msalApp.getAllAccounts().length){$("app").innerHTML='<div class="card">جاري التحميل...</div>';try{await load();render()}catch(e){$("app").innerHTML='<div class="card red">'+e.message+'</div>'}}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
