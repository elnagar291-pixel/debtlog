<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المديونية</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0f766e">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#667;--pr:#0f766e;--red:#b91c1c;--bd:#dde}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2127;--tx:#eee;--mut:#9ab;--bd:#334}}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--pr);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
main{padding:12px;max-width:600px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-top:8px}
button{background:var(--pr);color:#fff;border:0;font-weight:bold}button.alt{background:#b45309}button.gr{background:#667}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.cust{cursor:pointer}.red{color:var(--red);font-weight:bold}.mut{color:var(--mut);font-size:13px}
.soon{border:2px solid #d97706;background:rgba(217,119,6,.12)}.late{border:2px solid #b91c1c;background:rgba(185,28,28,.10)}.tag{font-size:12px;padding:2px 8px;border-radius:8px;color:#fff}.tag.o{background:#d97706}.tag.r{background:#b91c1c}
.big{text-align:center}.num{font-size:26px;font-weight:bold}.gn{color:#15803d}.tile{display:flex;justify-content:space-between;align-items:center;font-size:18px;cursor:pointer}
.sync{padding:5px 14px;font-size:13px;cursor:pointer;text-align:center}.sync.ok{background:rgba(21,128,61,.15);color:#15803d}.sync.wait{background:rgba(217,119,6,.18);color:#b45309}.sync.err{background:rgba(185,28,28,.15);color:#b91c1c}
.ta{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:13px Arial}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}#msg{position:fixed;bottom:16px;left:16px;right:16px;background:#111;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center}
</style></head><body>
<header><b onclick="home()" style="cursor:pointer">متابعة المديونية</b><span id="today" class="mut" style="color:#fff"></span></header><div id="sync" class="sync" onclick="show(curV,true)"></div>
<main id="app"><div class="card">
<p>اتأكد إنك مدخل الـ Client ID في أول الكود (CONFIG).</p><button onclick="login()">تسجيل الدخول بحساب Microsoft</button></div></main>
<div id="msg"></div>
<script>
// ===== CONFIG =====
const CONFIG={clientId:"b79514a7-23a6-4a62-b7d8-1d6ef6c52582",filePath:"/ENGING.xlsx",sheet:"Sheet3"};
// ==================
if(typeof msal==="undefined"){document.addEventListener("DOMContentLoaded",()=>{$("app").innerHTML='<div class="card red">مكتبة الدخول ما اتحملتش، تأكد من النت وجرب تاني</div>'})}
const msalApp=typeof msal==="undefined"?null:new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:"https://login.microsoftonline.com/3e049ef2-19d4-4c16-ae1b-82d2a3a0af6a",redirectUri:"https://elnagar291-pixel.github.io/debtlog/"},cache:{cacheLocation:"localStorage"}});
const SCOPES=["Files.ReadWrite","User.Read"];let customers=[],dateCols=[],cur=null,sid=null,tk="";
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString("en-US");
const serial=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)+25569;
const fromSerial=s=>typeof s==="number"&&s>0?new Date((s-25569)*864e5):null;
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const serialY=t=>{const[a,b,c]=t.split("-").map(Number);return Math.floor(Date.UTC(a,b-1,c)/864e5)+25569};
const dstr=d=>d?String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear():"";
const colL=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const dayKey=n=>{const d=fromSerial(n);return d?(d.getUTCMonth()+1)*100+d.getUTCDate():0};
const findCol=ds=>{const k=dayKey(ds);return k?dateCols.findIndex(d=>d&&dayKey(d)===k):-1};
function parseD(x){if(typeof x==="number")return x>0?Math.floor(x):0;if(typeof x!=="string")return 0;
 const t=x.trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)),M="jan feb mar apr may jun jul aug sep oct nov dec".split(" "),y0=new Date().getFullYear();let r,m,d,y;
 if(r=t.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)){y=+r[1];m=+r[2];d=+r[3]}
 else if(r=t.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*(?:[-\/ ](\d{2,4}))?/)){d=+r[1];m=M.indexOf(r[2].toLowerCase())+1;y=r[3]?+r[3]:y0;if(y<100)y+=2000}
 else if(r=t.match(/^(\d{1,2})[-\/](\d{1,2})(?:[-\/](\d{2,4}))?$/)){d=+r[1];m=+r[2];y=r[3]?+r[3]:y0;if(y<100)y+=2000}
 else return 0;
 if(!m||m>12||!d)return 0;return Math.floor(Date.UTC(y,m-1,d)/864e5)+25569}
let LAY={act:33};try{const x=+localStorage.getItem("act");if(x>=33)LAY.act=x}catch(e){}
const monthOf=n=>{const d=fromSerial(n);return d?{y:d.getUTCFullYear(),m:d.getUTCMonth()+1}:null};
const monthLen=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const ser3=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5)+25569;
function aligned(){const sm=monthOf(dateCols[0]);if(!sm||dateCols.length<31)return false;const L=monthLen(sm.y,sm.m);
 return dateCols.every((n,k)=>{if(k>=L)return !n;const d=fromSerial(n);return !!d&&d.getUTCFullYear()===sm.y&&d.getUTCMonth()+1===sm.m&&d.getUTCDate()===k+1})}
function writeCol(ds){const sm=monthOf(dateCols[0]);
 if(!sm||!aligned()){toast("اضغط ⚙ تهيئة الشهر من الرئيسية الأول");return -1}
 const d=fromSerial(ds);if(d.getUTCFullYear()!==sm.y||d.getUTCMonth()+1!==sm.m){toast("التاريخ ده برة شهر "+sm.m+"/"+sm.y+" الحالي في الشيت. اقفل الشهر الأول");return -1}
 return d.getUTCDate()-1}
function bounds(){const sm=monthOf(dateCols[0]);if(!sm||!aligned())return null;const p=n=>String(n).padStart(2,"0");return{min:sm.y+"-"+p(sm.m)+"-01",max:sm.y+"-"+p(sm.m)+"-"+p(monthLen(sm.y,sm.m))}}
let dirty=false;document.addEventListener("input",e=>{if(e.target.type!=="date")dirty=true});
let selDate=ymd(new Date()),sortBy=(()=>{try{return localStorage.getItem("sortBy")||"due"}catch(e){return"due"}})();
function toast(t){const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2500)}
async function login(){try{await msalApp.loginRedirect({scopes:SCOPES})}catch(e){toast("خطأ: "+(e.message||e))}}
async function token(){const a=msalApp.getAllAccounts()[0];if(!a)throw"login";
 try{tk=(await msalApp.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken;return tk}catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES})}}
const BASE=()=>"https://graph.microsoft.com/v1.0/me/drive/root:"+encodeURI(CONFIG.filePath)+":/workbook";
// جلسة عمل مع الإكسيل: بتسرّع كل المكالمات اللي بعدها
async function session(){try{const t=await token();const r=await fetch(BASE()+"/createSession",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({persistChanges:true})});sid=r.ok?(await r.json()).id:null}catch(e){sid=null}}
// قفل جلسة الإكسيل أول ما تسيب التطبيق، عشان الملف ما يفضلش "مفتوح" وتقدر تمسحه أو تغيّر اسمه
function closeSess(){if(!sid||!tk)return;const s0=sid;sid=null;try{fetch(BASE()+"/closeSession",{method:"POST",keepalive:true,headers:{Authorization:"Bearer "+tk,"workbook-session-id":s0,"Content-Type":"application/json"},body:"{}"}).catch(()=>{})}catch(e){}}
async function g(path,opt={},retry=true){const t=await token(),h={Authorization:"Bearer "+t,"Content-Type":"application/json"};if(sid)h["workbook-session-id"]=sid;
 const r=await fetch(BASE()+path,{...opt,headers:h});
 if(!r.ok){if(sid&&retry){sid=null;await session();return g(path,opt,false)}throw new Error(r.status+" "+(await r.text()).slice(0,120))}
 const tx=await r.text();return tx?JSON.parse(tx):null}
const rng=a=>"/worksheets('"+CONFIG.sheet+"')/range(address='"+a+"')";
const put=(a,v)=>g(rng(a),{method:"PATCH",body:JSON.stringify({values:v})});
// طابور الكتابة: التغيير بيظهر فورًا والحفظ في الشيت بيتم ورا الكواليس بالترتيب
let q=Promise.resolve(),wgen=0,pend=0,lastSync=null,syncErr=false;
function setSync(){const e=$("sync");if(!e)return;
 if(pend>0){e.textContent="⏳ جاري الحفظ في الشيت...";e.className="sync wait"}
 else if(syncErr){e.textContent="⚠ المزامنة فشلت، اضغط للمحاولة تاني";e.className="sync err"}
 else if(lastSync){e.textContent="✔ تمت المزامنة · آخر تحديث "+lastSync.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});e.className="sync ok"}
 else{e.textContent="";e.className="sync"}}
function enqueue(f){wgen++;pend++;setSync();q=q.then(f).then(()=>{pend--;syncErr=false;lastSync=new Date();setSync();if(pend===0&&document.hidden)closeSess()}).catch(e=>{pend--;syncErr=true;setSync();toast("فشل الحفظ: "+(e.message||e));return load(true).then(()=>show(curV)).catch(()=>{})})}
// قراءة الشيت: الصف 2 = تواريخ الأيام (F..AF)، الصفوف 4..73 = العملاء
async function load(force){if(!force)await q;const g0=wgen;let r=await g(rng("A2:"+colL(LAY.act+8)+"73")+"?$select=values"),v=r.values;
 if(String(v[1][LAY.act-1]).trim()!=="Actual"){const h=(await g(rng("A3:GZ3")+"?$select=values")).values[0],ix=h.findIndex(x=>String(x).trim()==="Actual");
  if(ix<0)throw new Error("مش لاقي عمود Actual في الصف 3 من الشيت");LAY.act=ix+1;try{localStorage.setItem("act",LAY.act)}catch(e){}
  r=await g(rng("A2:"+colL(LAY.act+8)+"73")+"?$select=values");v=r.values}
 if(!force&&wgen!==g0)return;
 dateCols=v[0].slice(5,LAY.act-1).map(parseD);customers=[];
 for(let i=2;i<v.length;i++){const w=v[i],n=String(w[2]).trim();if(!n)continue;
  customers.push({row:i+2,n,a:w[3],ds:typeof w[1]==="number"?w[1]:0,d:fromSerial(w[1]),debt:+w[4]||0,pay:w.slice(5,LAY.act-1).map(x=>+x||0),dn:+w[LAY.act]||0})}
 if(["due","name","rest"].includes(v[0][LAY.act+7]))sortBy=v[0][LAY.act+7];
 if(cur){const c=customers.find(x=>x.row===cur.row&&x.n===cur.n);if(c)cur=c}
 syncErr=false;lastSync=new Date();setSync()}
function stat(c){const p=c.pay.reduce((a,x)=>a+x,0);return{p,dn:c.dn,rest:c.debt-p-c.dn}}
function sumDay(ds){const k=findCol(ds);return ds&&k>=0?customers.reduce((a,c)=>a+(c.pay[k]||0),0):0}
// ===== التنقل =====
const LV={home:0,customers:1,coll:1,add:2,cust:2,hist:3,adddebt:3,link:1,import:1};let curV="home";
function hp(v){history.pushState({v},"");curV=v}
function draw(v,refresh){v==="customers"?(refresh?list():custPage()):v==="coll"?collPage():v==="cust"?openC(cur):render()}
async function show(v,reload){dirty=false;if(v==="add")v="customers";if(v==="hist"||v==="adddebt")v="cust";if(v==="cust"&&!cur)v="customers";curV=v;draw(v);
 if(reload){try{await load()}catch(e){syncErr=true;setSync();return toast("تعذر التحديث: "+e.message)}
  if(curV!==v)return;if(v!=="customers"&&dirty)return;draw(v,true)}}
async function nav(v){hp(v);await show(v,true)}
function home(){const d=LV[curV]||0;d?history.go(-d):render()}
window.addEventListener("popstate",e=>show((e.state&&e.state.v)||"home",true));
try{history.replaceState({v:"home"},"")}catch(e){}
// ===== الشاشات =====
function render(){curV="home";const sm=monthOf(dateCols[0]),now=monthOf(serial(new Date())),al=aligned();const total=customers.reduce((a,c)=>a+stat(c).rest,0),tp=sumDay(serial(new Date()));
 $("app").innerHTML=(!al?`<div class="card soon" onclick="setupSheet()"><b>⚙ تهيئة الشهر (31 يوم)</b><div class="mut">الأعمدة محتاجة ترتيب على أيام الشهر، اضغط هنا</div></div>`:(sm&&now&&now.y*12+now.m>sm.y*12+sm.m?`<div class="card late" onclick="closeMonth()"><b>📅 الشهر الجديد بدأ</b><div class="mut">اضغط لإقفال شهر ${sm.m}/${sm.y} وترحيل المتبقي</div></div>`:""))+`<div class="g"><div class="card big"><div class="mut">إجمالي المديونية</div><div class="num red">${fmt(total)}</div></div><div class="card big"><div class="mut">تحصيل اليوم</div><div class="num gn">${fmt(tp)}</div></div></div>
 <div class="card tile" onclick="nav('customers')"><b>👥 العملاء</b><span class="mut">${customers.length} عميل</span></div>
 <div class="card tile" onclick="nav('coll')"><b>💰 التحصيلات اليومية</b><span class="mut">عرض وتعديل</span></div>
 <div class="card tile" onclick="closeMonth()"><b>📅 إقفال الشهر</b><span class="mut">${sm?sm.m+"/"+sm.y:""}</span></div>
 <div class="card tile" onclick="hp('link');linkPage()"><b>🔗 رابط المحصّل</b><span class="mut">للاطلاع فقط</span></div>
 <div class="card tile" onclick="hp('import');importPage()"><b>📥 ترحيل تحصيلات المحصّل</b><span class="mut">من واتساب</span></div>`}
function custPage(){$("app").innerHTML=`<button class="gr" onclick="history.back()">← الرئيسية</button><input id="q" placeholder="ابحث باسم العميل" oninput="list()"><div class="g"><select id="so" onchange="setSort(this.value)"><option value="due">ترتيب: تاريخ الاستحقاق</option><option value="name">ترتيب: أبجدي</option><option value="rest">ترتيب: الأكبر مديونية</option></select><button onclick="hp('add');addForm()">+ عميل جديد</button></div><div id="list" style="margin-top:10px"></div>`;$("so").value=sortBy;list()}
function setSort(v){sortBy=v;try{localStorage.setItem("sortBy",v)}catch(e){}enqueue(()=>put(colL(LAY.act+8)+"2",[[v]]));list()}
function list(){const el=$("list");if(!el)return;$("so").value=sortBy;const q=($("q")?.value||"").trim(),t=serial(new Date());
 let a=customers.filter(c=>c.n.includes(q));
 if(sortBy==="name")a.sort((x,y)=>x.n.replace(/^ال/,"").localeCompare(y.n.replace(/^ال/,""),"ar"));
 else if(sortBy==="rest")a.sort((x,y)=>stat(y).rest-stat(x).rest);
 else a.sort((x,y)=>(x.ds||1e9)-(y.ds||1e9));
 el.innerHTML=a.map(c=>{const s=stat(c),dl=c.ds-t;let cls="",tag="";
  if(s.rest>0&&c.ds){if(dl<0){cls=" late";tag=`<span class="tag r">متأخر ${-dl} يوم</span>`}else if(dl<=7){cls=" soon";tag=`<span class="tag o">باقي ${dl} يوم</span>`}}
  return `<div class="card cust${cls}" onclick="hp('cust');open_(${customers.indexOf(c)})"><div class="row" style="border:0"><b>${c.n}</b><span class="${s.rest>0?"red":""}">${fmt(s.rest)}</span></div><div class="mut">${c.a||""} · استحقاق ${dstr(c.d)} ${tag}</div></div>`}).join("")}
function addForm(){$("app").innerHTML=`<div class="card"><h3 style="margin:0">عميل جديد</h3><input id="cn" placeholder="اسم العميل"><input id="ca" placeholder="المنطقة"><span class="mut">تاريخ الاستحقاق</span><input id="cd" type="date" value="${ymd(new Date())}"><input id="cm" type="number" inputmode="decimal" placeholder="المديونية"><button onclick="addCust()">حفظ العميل</button></div><button class="gr" onclick="history.back()">رجوع</button>`;
 Promise.all([loadArch(c.n),loadAdds()]).then(([r,ad])=>{if(!(curV==="hist"&&cur===c))return;const lab=curLab(),mine=ad.filter(x=>String(x[1]).trim()===c.n&&x[0]===lab);let h="";
 if(mine.length)h+='<div class="card"><b>➕ زيادات المديونية (الشهر الحالي)</b>'+mine.map(x=>`<div class="row"><span>${x[2]} <span class="mut">${x[4]||""}</span></span><b>${fmt(x[3])}</b></div>`).join("")+'</div>';
 if(r.length)h+='<div class="mut" style="margin:6px 4px">الشهور السابقة</div>'+archBlocks(r,false);
 if(h)$("app").firstElementChild.insertAdjacentHTML("afterend",h)})}
function addCust(){const n=$("cn").value.trim(),a=$("ca").value.trim(),d=$("cd").value,m=parseFloat($("cm").value);
 if(!n||!d||isNaN(m))return toast("اكتب الاسم والتاريخ والمديونية");
 if(customers.some(c=>c.n===n))return toast("العميل ده موجود قبل كده");
 const used=new Set(customers.map(c=>c.row));let r=4;while(r<=73&&used.has(r))r++;if(r>73)return toast("الشيت مليان (آخر صف 73)");
 const ds=serialY(d);customers.push({row:r,n,a,ds,d:fromSerial(ds),debt:m,pay:Array(dateCols.length).fill(0),dn:0});
 enqueue(()=>put("B"+r+":E"+r,[[ds,n,a,m]]));toast("اتضاف ✔");history.back()}
function open_(i){openC(customers[i])}
function openC(c){dirty=false;cur=c;const bn=bounds();const s=stat(c);
 $("app").innerHTML=`<div class="card"><h3 style="margin:0">${c.n}</h3><div class="mut">${c.a||""} · استحقاق ${dstr(c.d)}</div>
 <div class="row"><span>المديونية</span><b>${fmt(c.debt)}</b></div><div class="row"><span>مدفوع</span><b>${fmt(s.p)}</b></div><div class="row"><span>إشعار خصم DN</span><b>${fmt(s.dn)}</b></div><div class="row"><span>المتبقي</span><b class="red">${fmt(s.rest)}</b></div></div>
 <div class="card"><span class="mut">تاريخ الدفعة</span><input id="dt" type="date" value="${bn?(selDate<bn.min?bn.min:selDate>bn.max?bn.max:selDate):selDate}"${bn?` min="${bn.min}" max="${bn.max}"`:""}><input id="amt" type="number" inputmode="decimal" placeholder="المبلغ">
 <div class="g"><button onclick="add('Payment')">تسجيل دفعة</button><button class="alt" onclick="add('DN')">تسجيل DN</button></div></div>
 <div class="card"><b>تعديل بيانات العميل</b><br><span class="mut">المديونية</span><input id="ed" type="number" inputmode="decimal" value="${c.debt}"><span class="mut">تاريخ الاستحقاق</span><input id="eds" type="date" value="${c.d?c.d.toISOString().slice(0,10):""}"><button onclick="saveCust()">حفظ التعديل</button></div>
 <div class="g"><button class="alt" onclick="hp('adddebt');debtForm()">➕ إضافة مديونية</button><button class="alt" onclick="hp('hist');histPage()">📋 سجل الدفعات</button></div><button class="gr" onclick="history.back()">رجوع</button><button style="background:#b91c1c" onclick="delCust()">حذف العميل</button>`}
function add(type){const a=parseFloat($("amt").value);if(!a||a<=0)return toast("اكتب مبلغ صحيح");const c=cur,row=c.row;
 if(type==="DN"){c.dn+=a;const v=c.dn;enqueue(()=>put(colL(LAY.act+1)+row,[[v]]))}
 else{const dv=$("dt").value||ymd(new Date()),ds=serialY(dv);const k=writeCol(ds);if(k<0)return;
  const v=(c.pay[k]||0)+a;c.pay[k]=v;selDate=dv;enqueue(()=>put(colL(6+k)+row,[[v]]))}
 toast("اتسجل ✔");openC(c)}
function saveCust(){const m=parseFloat($("ed").value),d=$("eds").value;if(isNaN(m)||m<0)return toast("اكتب مديونية صحيحة");const c=cur,row=c.row;
 c.debt=m;if(d){c.ds=serialY(d);c.d=fromSerial(c.ds)}

let dayCache=null;
async function dayPdf(share){const ds=serialY(selDate),name="تقرير تحصيل "+dstr(fromSerial(ds)).replace(/\//g,"-")+".pdf";
 try{const adds=(await loadAdds()).filter(x=>x[0]===curLab()),html=dayReportHTML(ds,adds);let b;
  if(dayCache&&dayCache.html===html)b=dayCache.blob;else{b=await htmlToPdf(html);dayCache={html,blob:b}}
  if(share){const f=new File([b],name,{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else{dlBlob(b,name);toast("المشاركة مش مدعومة هنا، اتحفظ الملف")}}
  else{dlBlob(b,name);toast("اتحفظ الملف ✔")}}
 catch(e){if(e.name==="AbortError")return;if(e.name==="NotAllowedError")toast("الملف جاهز ✔ اضغط مشاركة تاني");else toast("خطأ: "+(e.message||e))}}
function dlBlob(b,name){const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function pdfSave(){try{const b=await buildPDF();dlBlob(b,"كشف حساب "+cur.n+".pdf");toast("اتحفظ الملف ✔")}catch(e){toast("خطأ: "+(e.message||e))}}
async function pdfShare(){const name="كشف حساب "+cur.n+".pdf";
 try{const b=await buildPDF(),f=new File([b],name,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});
  else{dlBlob(b,name);toast("المشاركة مش مدعومة هنا، اتحفظ الملف")}}
 catch(e){if(e.name==="AbortError")return;if(e.name==="NotAllowedError")toast("الملف جاهز ✔ اضغط مشاركة تاني");else toast("خطأ: "+(e.message||e))}}
function collPage(){dirty=false;curV="coll";const ds=serialY(selDate),k=findCol(ds),day=k<0?[]:customers.filter(c=>c.pay[k]>0),tp=day.reduce((a,c)=>a+c.pay[k],0);
 $("app").innerHTML=`<button class="gr" onclick="history.back()">← الرئيسية</button><div class="card"><span class="mut">اختر اليوم</span><input id="sd" type="date" value="${selDate}" onchange="selDate=this.value||ymd(new Date());collPage()">
 <div class="row"><span>تحصيل ${dstr(fromSerial(ds))}</span><b class="gn">${fmt(tp)}</b></div><div class="row"><span>عدد العملاء</span><b>${day.length}</b></div>${day.length?`<div class="g"><button onclick="dayPdf(true)">📤 مشاركة التقرير</button><button class="alt" onclick="dayPdf(false)">⬇ حفظ PDF</button></div>`:""}</div>`+
 (day.length?day.map(c=>`<div class="card"><b>${c.n}</b><div class="g"><input type="number" inputmode="decimal" id="a${c.row}" value="${c.pay[k]}"><button onclick="saveP(${c.row},${k})">حفظ</button></div><button class="gr" onclick="delP(${c.row},${k})">حذف الدفعة</button></div>`).join(""):'<div class="card mut">مفيش تحصيلات في اليوم ده</div>')}
function saveP(row,k){const a=parseFloat($("a"+row).value);if(!a||a<=0)return toast("اكتب مبلغ صحيح");const c=customers.find(x=>x.row===row);if(!c)return;
 c.pay[k]=a;enqueue(()=>put(colL(6+k)+row,[[a]]));toast("اتعدل ✔");collPage()}
function delP(row,k){if(!confirm("حذف الدفعة دي؟"))return;const c=customers.find(x=>x.row===row);if(!c)return;
 c.pay[k]=0;enqueue(()=>put(colL(6+k)+row,[[""]]));toast("اتحذفت ✔");collPage()}

const b64u=u=>{let t="";u.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const x=atob(t),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u};
async function encTok(o){const u=new TextEncoder().encode(JSON.stringify(o));
 if(typeof CompressionStream!=="undefined"){const r=await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();return"z."+b64u(new Uint8Array(r))}return"p."+b64u(u)}
async function decTok(t){let u=unb64u(t.slice(2));if(t[0]==="z")u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());return JSON.parse(new TextDecoder().decode(u))}
const ownerPhone=()=>{try{return localStorage.getItem("ownerPhone")||""}catch(e){return""}};
function savePh(v){try{localStorage.setItem("ownerPhone",String(v).replace(/\D/g,""))}catch(e){}linkPage()}

 const rows=customers.map(c=>[c.n,c.a||"",stat(c).rest,c.ds||0]).filter(x=>x[2]>0),g0=serial(new Date());
 $("app").innerHTML=`<button class="gr" onclick="history.back()">← الرئيسية</button><div class="card"><h3 style="margin:0">🔗 رابط المحصّل</h3>
 <div class="mut">قائمة بـ ${rows.length} عميل عليهم مديونية، بتاريخ ${dstr(fromSerial(g0))}. المحصّل بيشوفها ويسجل التحصيل بس، ومفيش أي تحكم في المديونية.</div>
 <span class="mut">رقم واتساب بتاعك (عشان التحصيلات توصلك)</span><input type="tel" inputmode="numeric" placeholder="مثال: 201001234567" value="${ownerPhone()}" onchange="savePh(this.value)">
 <textarea id="lkU" class="ta" readonly rows="4" style="direction:ltr;font-size:12px">جاري التجهيز...</textarea>
 <div class="g"><button onclick="lkShare()">📤 مشاركة الرابط</button><button class="alt" onclick="lkCopy()">📋 نسخ</button></div>
 <div class="mut" style="margin-top:8px">⚠ أي حد معاه الرابط يشوف الأسماء والمديونيات. الرابط بينتهي بعد 7 أيام، واعمل رابط جديد كل ما الأرقام تتغير.</div></div>`;
 const tok=await encTok({v:1,g:g0,x:g0+7,p:ownerPhone(),r:rows});lkURL=new URL("collector.html",location.href).href+"#d="+tok;
 if(curV==="link"&&$("lkU"))$("lkU").value=lkURL}
async function lkShare(){if(!lkURL)return;try{if(navigator.share)await navigator.share({title:"قائمة التحصيل",text:"رابط قائمة العملاء لتسجيل التحصيل:",url:lkURL});else lkCopy()}catch(e){}}

function colOf(ds){const sm=monthOf(dateCols[0]);if(!sm||!aligned())return -1;const d=fromSerial(ds);if(!d||d.getUTCFullYear()!==sm.y||d.getUTCMonth()+1!==sm.m)return -1;return d.getUTCDate()-1}
let impRows=[],impWho="";
function importPage(){curV="import";impRows=[];
 $("app").innerHTML=`<button class="gr" onclick="history.back()">← الرئيسية</button><div class="card"><h3 style="margin:0">📥 ترحيل تحصيلات المحصّل</h3><div class="mut">الصق رسالة الواتساب كاملة اللي بعتهالك المحصّل (بما فيها السطر اللي فيه #DBT)</div><textarea id="impT" class="ta" rows="7" placeholder="الصق الرسالة هنا"></textarea><button onclick="impRead()">قراءة الرسالة</button></div><div id="impOut"></div>`}
async function importedIds(){try{const r=await g("/worksheets('CollectorLog')/usedRange?$select=values");return new Set(r.values.slice(1).map(x=>String(x[0])))}catch(e){return new Set()}}
async function impRead(){const m=($("impT").value||"").match(/#DBT:([pz]\.[A-Za-z0-9_-]+)/);if(!m)return toast("مش لاقي كود التحصيلات في الرسالة");
 try{const o=await decTok(m[1]),done=await importedIds();impWho=o.c||"";
  impRows=o.e.map(e=>{const[id,n,a,d,note]=e,c=customers.find(x=>x.n===String(n).trim()),k=c?colOf(d):-1;let st="ok";
   if(!c)st="العميل مش موجود";else if(!(a>0))st="مبلغ غلط";else if(done.has(String(id)))st="اتحوّل قبل كده";else if(k<0)st="التاريخ برة شهر الشيت";return{id:String(id),n:String(n).trim(),a:+a,d,note,c,k,st}});impShow()}
 catch(e){toast("الكود تالف: "+(e.message||e))}}
function impShow(){const ok=impRows.filter(r=>r.st==="ok"),tot=ok.reduce((t,r)=>t+r.a,0);
 $("impOut").innerHTML=`<div class="card"><b>المحصّل: ${impWho||"-"}</b><div class="row"><span>تحصيلات صالحة للترحيل</span><b>${ok.length} من ${impRows.length}</b></div><div class="row"><span>إجمالي الصالح</span><b class="gn">${fmt(tot)}</b></div>
 ${impRows.map(r=>`<div class="row"><span>${r.n} <span class="mut">${dstr(fromSerial(r.d)).slice(0,5)}</span></span><span><b>${fmt(r.a)}</b> ${r.st==="ok"?"✔":`<span class="red">${r.st}</span>`}</span></div>`).join("")}
 ${ok.length?`<button onclick="impCommit()">✅ ترحيل ${ok.length} تحصيل</button>`:""}</div>`}
function impCommit(){const ok=impRows.filter(r=>r.st==="ok");if(!ok.length)return;const grp={};
 ok.forEach(r=>{const key=r.c.row+"|"+r.k;grp[key]=grp[key]||{c:r.c,k:r.k,a:0};grp[key].a+=r.a});
 Object.values(grp).forEach(x=>{const v=(x.c.pay[x.k]||0)+x.a,row=x.c.row,k=x.k;x.c.pay[k]=v;enqueue(()=>put(colL(6+k)+row,[[v]]))});
 const who=impWho,td=dstr(fromSerial(serial(new Date()))),rows=ok.map(r=>[r.id,dstr(fromSerial(r.d)),r.n,r.a,who,td]);
 enqueue(()=>sheetAppend("CollectorLog",["رقم الحركة","تاريخ التحصيل","العميل","المبلغ","المحصّل","تاريخ الترحيل"],rows,["@","@","@","General","@","@"]));
 toast("اترحّل "+ok.length+" تحصيل ✔");history.back()}
