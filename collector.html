<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>قائمة التحصيل</title><meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#667;--pr:#0f766e;--red:#b91c1c;--bd:#dde}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2127;--tx:#eee;--mut:#9ab;--bd:#334}}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{background:var(--pr);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header span{font-size:13px;opacity:.9}
main{padding:12px;max-width:600px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,button,select{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-top:8px}
button{background:var(--pr);color:#fff;border:0;font-weight:bold}button.alt{background:#b45309}button.gr{background:#667}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.mut{color:var(--mut);font-size:13px}.red{color:var(--red);font-weight:bold}.gn{color:#15803d;font-weight:bold}
.cust{cursor:pointer}.soon{border:2px solid #d97706;background:rgba(217,119,6,.12)}.late{border:2px solid #b91c1c;background:rgba(185,28,28,.10)}.paid{opacity:.55}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;color:#fff}.tag.o{background:#d97706}.tag.r{background:#b91c1c}.tag.g{background:#15803d}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{position:fixed;bottom:0;left:0;right:0;background:var(--pr);color:#fff;padding:16px;text-align:center;font-weight:bold;cursor:pointer}
#msg{position:fixed;bottom:80px;left:16px;right:16px;background:#111;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center}
</style></head><body>
<header><b>قائمة التحصيل</b><span id="gen"></span></header>
<main id="app"></main><div id="msg"></div>
<script>
const $=i=>document.getElementById(i),fmt=n=>Number(n||0).toLocaleString("en-US");
const serial=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)+25569;
const fromSerial=s=>s>0?new Date((s-25569)*864e5):null;
const dstr=d=>d?String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear():"";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const serialY=t=>{const[a,b,c]=t.split("-").map(Number);return Math.floor(Date.UTC(a,b-1,c)/864e5)+25569};
const b64u=u=>{let s="";u.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function enc(o){const u=new TextEncoder().encode(JSON.stringify(o));
 if(typeof CompressionStream!=="undefined"){const r=await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();return"z."+b64u(new Uint8Array(r))}return"p."+b64u(u)}
async function dec(t){let u=unb64u(t.slice(2));if(t[0]==="z")u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());return JSON.parse(new TextDecoder().decode(u))}
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let sortBy=LS.g("colSort")||"due";
function setSort(v){sortBy=v;LS.s("colSort",v);list()}
let snap=null,cur=null,entries=[];try{entries=JSON.parse(LS.g("colEntries")||"[]")}catch(e){}
const save=()=>LS.s("colEntries",JSON.stringify(entries));
function toast(t){const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2500)}
const since=n=>entries.filter(e=>e.n===n&&e.d>=snap.g).reduce((t,e)=>t+e.a,0);
const mineBar=()=>`<div class="bar" onclick="goMine()">📋 تحصيلاتي (${entries.length}) · ${fmt(entries.reduce((t,e)=>t+e.a,0))}</div>`;
function render(){
 if(!snap){$("app").innerHTML='<div class="card">الرابط ناقص أو تالف. اطلب من المدير رابط جديد.</div>'+mineBar();return}
 $("gen").textContent="القائمة بتاريخ "+dstr(fromSerial(snap.g));
 if(serial(new Date())>snap.x){$("app").innerHTML='<div class="card late">⚠ الرابط انتهى، اطلب رابط جديد من المدير.</div>'+mineBar();return}
 $("app").innerHTML=`<div class="g"><input id="q" placeholder="ابحث باسم العميل" oninput="list()"><select id="so" onchange="setSort(this.value)"><option value="due">ترتيب: تاريخ الاستحقاق</option><option value="name">ترتيب: أبجدي</option><option value="rest">ترتيب: الأكبر مديونية</option></select></div><div style="margin:6px 2px" class="mut">العملاء اللي عليهم مديونية: ${snap.r.length} · للاطلاع وتسجيل التحصيل فقط</div><div id="list"></div>`+mineBar();$("so").value=sortBy;list()}
function list(){const q=($("q").value||"").trim(),t=serial(new Date());
 const a=snap.r.map((r,i)=>({i,n:r[0],a:r[1],rest:r[2]-since(r[0]),due:r[3]})).filter(x=>x.n.includes(q)).sort((x,y)=>(x.rest<=0)-(y.rest<=0)||(sortBy==="name"?x.n.replace(/^ال/,"").localeCompare(y.n.replace(/^ال/,""),"ar"):sortBy==="rest"?y.rest-x.rest:(x.due||1e9)-(y.due||1e9)));
 $("list").innerHTML=a.map(c=>{const dl=c.due-t;let cls="",tag="";
  if(c.rest<=0)tag='<span class="tag g">✔ تم التحصيل</span>';
  else if(c.due){if(dl<0){cls=" late";tag=`<span class="tag r">متأخر ${-dl} يوم</span>`}else if(dl<=7){cls=" soon";tag=`<span class="tag o">باقي ${dl} يوم</span>`}}
  return `<div class="card cust${cls}${c.rest<=0?" paid":""}" onclick="openF(${c.i})"><div class="row" style="border:0"><b>${c.n}</b><span class="${c.rest>0?"red":""}">${fmt(c.rest)}</span></div><div class="mut">${c.a||""} · استحقاق ${dstr(fromSerial(c.due))} ${tag}</div></div>`}).join("")}
function openF(i){history.pushState({v:"form"},"");cur=i;const r=snap.r[i],rem=r[2]-since(r[0]);
 $("app").innerHTML=`<div class="card"><h3 style="margin:0">${r[0]}</h3><div class="mut">${r[1]||""} · استحقاق ${dstr(fromSerial(r[3]))}</div><div class="row"><span>المتبقي</span><b class="red">${fmt(rem)}</b></div>
 <span class="mut">تاريخ التحصيل</span><input id="dt" type="date" value="${ymd(new Date())}" max="${ymd(new Date())}"><input id="amt" type="number" inputmode="decimal" placeholder="المبلغ اللي اتحصّل"><input id="nt" placeholder="ملاحظة (اختياري)"><button onclick="saveE()">تسجيل التحصيل</button></div><button class="gr" onclick="history.back()">رجوع</button>`}
function saveE(){const a=parseFloat($("amt").value);if(!(a>0))return toast("اكتب مبلغ صحيح");const r=snap.r[cur],rem=r[2]-since(r[0]);
 if(a>rem&&!confirm("المبلغ أكبر من المتبقي ("+fmt(rem)+")، تكمل؟"))return;
 entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:r[0],a,d:serialY($("dt").value||ymd(new Date())),t:$("nt").value.trim(),s:0});save();toast("اتسجل ✔");history.back()}
function goMine(){history.pushState({v:"mine"},"");mine()}
function mine(){const un=entries.filter(e=>!e.s),tu=un.reduce((t,e)=>t+e.a,0),ta=entries.reduce((t,e)=>t+e.a,0);
 const L=entries.map((e,i)=>({e,i})).sort((x,y)=>y.e.d-x.e.d||y.i-x.i);
 $("app").innerHTML=`<button class="gr" onclick="history.back()">← القائمة</button><div class="card"><b>تحصيلاتي</b><div class="row"><span>لسه ما اتبعتتش (${un.length})</span><b class="gn">${fmt(tu)}</b></div><div class="row"><span>الإجمالي</span><b>${fmt(ta)}</b></div>
 <div class="g"><button onclick="send(false)">📤 إرسال الجديد</button><button class="alt" onclick="send(true)">📤 إرسال الكل</button></div><div class="mut" style="margin-top:8px">بيفتح واتساب برسالة جاهزة، اضغط إرسال هناك.</div></div>`+
 (L.length?L.map(x=>`<div class="card"><div class="row" style="border:0"><b>${x.e.n}</b><span class="gn">${fmt(x.e.a)}</span></div><div class="mut">${dstr(fromSerial(x.e.d))}${x.e.t?" · "+x.e.t:""} · ${x.e.s?"✔ اتبعت":"لسه"} ${x.e.s?"":`<span style="float:left;cursor:pointer" onclick="del(${x.i})">🗑 حذف</span>`}</div></div>`).join(""):'<div class="card mut">مفيش تحصيلات متسجلة</div>')}
function del(i){if(!confirm("حذف التحصيل ده؟"))return;entries.splice(i,1);save();mine()}
async function send(all){const L=entries.filter(e=>all||!e.s);if(!L.length)return toast("مفيش تحصيلات تتبعت");
 let nm=LS.g("colName");if(!nm){nm=(prompt("اكتب اسمك")||"").trim();if(nm)LS.s("colName",nm)}
 const tok=await enc({v:1,c:nm,e:L.map(e=>[e.id,e.n,e.a,e.d,e.t])}),today=serial(new Date()),tot=L.reduce((t,e)=>t+e.a,0);
 const msg="تحصيلات"+(nm?" — "+nm:"")+" بتاريخ "+dstr(fromSerial(today))+"\n"+L.map((e,i)=>(i+1)+") "+e.n+": "+fmt(e.a)+(e.d!==today?" ("+dstr(fromSerial(e.d)).slice(0,5)+")":"")).join("\n")+"\nالإجمالي: "+fmt(tot)+"\n\n#DBT:"+tok;
 L.forEach(e=>e.s=1);save();location.href="https://wa.me/"+((snap&&snap.p)||"")+"?text="+encodeURIComponent(msg)}
window.addEventListener("popstate",e=>{const v=e.state&&e.state.v;v==="mine"?mine():render()});
(async()=>{const m=location.hash.match(/d=([pz]\.[A-Za-z0-9_-]+)/);
 try{if(m){snap=await dec(m[1]);LS.s("colSnap",m[1])}else{const t=LS.g("colSnap");if(t)snap=await dec(t)}}catch(e){snap=null}
 try{history.replaceState({v:"list"},"")}catch(e){}render()})();
</script></body></html>
